# Sandbox-specific values for agent-api-chart
# Only include values that differ from base or local, or are required for sandbox

replicaCount: 2

image:
  registry: ghcr.io/bouc-io
  repository: application/agent/agent-api-server
  tag: "1.0.2255735448" # This should be replaced by a real tag in production/deployment
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: nginx
    kubernetes.io/tls-acme: "true"
  hosts:
    - host: agent-sandbox.example.com
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - secretName: agent-sandbox-tls
      hosts:
        - agent-sandbox.example.com

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75

# Kubernetes Health Probes (tighter settings for sandbox)
startupProbe:
  httpGet:
    path: /health/live
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 30 # 150s max startup

livenessProbe:
  httpGet:
    path: /health/live
    port: http
  initialDelaySeconds: 0
  periodSeconds: 10 # More frequent checks than base
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health/ready
    port: http
  initialDelaySeconds: 0
  periodSeconds: 5 # More frequent checks than base
  timeoutSeconds: 3
  failureThreshold: 3
  successThreshold: 1

postgresql:
  enabled: true
  global:
    ## Security parameters
    ##
    security:
      allowInsecureImages: true
  image:
    registry: docker.io
    repository: pgvector/pgvector
    tag: 0.8.1-pg18-trixie
  auth:
    username: ps_agent_snbx
    database: ps_agent_db_snbx
    # Both the bundled Postgres and the app read from this ESO-managed Secret:
    # Postgres takes the `password` key, the app takes the `DATABASE_URL` key that
    # the ExternalSecret template assembles. Keep username and database in sync
    # with the DSN in infrastructure/external-secrets/externalsecrets/sandbox/.
    existingSecret: boucio-agent-db-secret
    secretKeys:
      adminPasswordKey: password
      userPasswordKey: password
  architecture: standalone

environment:
  # Environment identity for telemetry labels. ${ENVIRONMENT_ID} is substituted from the
  # manually-created cluster-vars ConfigMap by Flux postBuild (local-config Kustomization).
  ENVIRONMENT_ID: "${ENVIRONMENT_ID}"
  NODE_ENV: "development"
  PORT: 3000
  CORS_ORIGIN: "*"
  # LLM Configuration
  OLLAMA_URL: "http://ollama-chart.default.svc.cluster.local:11434"
  OLLAMA_MODEL: "qwen3.5:2b"
  # OAuth2 Configuration (for token refresh)
  OAUTH_TOKEN_ENDPOINT: "https://sso.${CLUSTER_DOMAIN}/realms/users/protocol/openid-connect/token"
  OAUTH_CLIENT_ID: "oauth2-proxy"
  # SSL/TLS Configuration
  ALLOW_SELF_SIGNED_CERTS: "false"
  # Logging Configuration
  LOG_LEVEL: "info"
  # Tool Execution Configuration
  TOOL_DEFAULT_TIMEOUT_MS: "30000"
  # Memory Service Configuration
  MEMORY_SERVICE_URL: "http://memory-api-chart.default.svc.cluster.local:80"
  MEMORY_SERVICE_ENABLED: "true"
  # Distillation Service Configuration
  # memory-api-chart serves /v1/memories and /v1/assignments only; /v1/distill lives on
  # memory-distiller-chart, so the old value made every distillation call 404 silently.
  DISTILLATION_SERVICE_URL: "http://memory-distiller-chart.default.svc.cluster.local:80"
  DISTILLATION_ENABLED: "true"
  # Instruction services (GAP 4)
  ADMIN_API_URL: "http://admin-api-chart.default.svc.cluster.local:80"
  PORTAL_API_URL: "http://portal-api-chart.default.svc.cluster.local:80"

# If using external DB in sandbox, override here
externalDatabase:
  host: ""
  port: 5432
  user: bn_agent
  database: bitnami_agent
  password: ""
  existingSecret: ""
  existingSecretHostKey: ""
  existingSecretPortKey: ""
  existingSecretUserKey: ""
  existingSecretDatabaseKey: ""
  existingSecretPasswordKey: ""
  annotations: {}

# Redis for BullMQ job queues (sandbox environment)
redis:
  enabled: true
  global:
    ## Security parameters
    ##
    security:
      allowInsecureImages: true
  architecture: standalone
  image:
    registry: docker.io
    repository: bitnamilegacy/redis
    tag: 7.4.3-debian-12-r0
  auth:
    enabled: true
    # Password comes from External Secrets. The same Secret also carries REDIS_URL,
    # which the app reads via secretKeyRef, so no password lands in a ConfigMap.
    existingSecret: boucio-agent-redis-secret
    existingSecretPasswordKey: redis-password
  master:
    persistence:
      enabled: true
      size: 2Gi
    resources:
      limits:
        cpu: 250m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi
