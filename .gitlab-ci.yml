# Shared Helm validation jobs. Private project: the identity running the pipeline
# needs at least Reporter on bouc-io/ci-templates or the include fails to resolve.
include:
  - project: 'bouc-io/ci-templates'
    ref: main
    file: '/helm.yml'

# This file is a template, and might need editing before it works on your project.
# This is a sample GitLab CI/CD configuration file that should run without any modifications.
# It demonstrates a basic 3 stage CI/CD pipeline. Instead of real tests or scripts,
# it uses echo commands to simulate the pipeline execution.
#
# A pipeline is composed of independent jobs that run scripts, grouped into stages.
# Stages run in sequential order, but jobs within stages run in parallel.
#
# For more information, see: https://docs.gitlab.com/ee/ci/yaml/index.html#stages
#
# You can copy and paste this template into a new `.gitlab-ci.yml` file.
# You should not add this template to an existing `.gitlab-ci.yml` file by using the `include:` keyword.
#
# To contribute improvements to CI/CD templates, please follow the Development guide at:
# https://docs.gitlab.com/ee/development/cicd/templates.html
# This specific template is located at:
# https://gitlab.com/gitlab-org/gitlab/-/blob/master/lib/gitlab/ci/templates/Getting-Started.gitlab-ci.yml

stages:
  - validate
  - build
  - publish

variables:
  HELM_EXPERIMENTAL_OCI: 1
  CHART: agent-api-chart

# Lints the chart against both value overlays (base+lcl and base+snbx). Runs in
# the validate stage so a broken chart never reaches helm package or publish-oci.
helm-lint:
  extends: .helm-lint

build:
  stage: build
  image:
    name: alpine/helm:latest
    entrypoint: ["/bin/sh", "-c"]
  before_script:
    #- apk add git
    - helm version
    - helm dependency update
    #- helm plugin install https://github.com/chartmuseum/helm-push.git
    #- >
    #  helm repo add ${CHART}
    #  --username ${CI_REGISTRY_USER}
    #  --password ${CI_REGISTRY_PASSWORD}
    #  ${CI_REGISTRY}/${CI_PROJECT_ROOT_NAMESPACE}/
  script:
    #- helm package ${CHART}
    - helm package .
  artifacts:
    paths:
      - ${CHART}-*.tgz

# Publish the packaged chart as an OCI artifact to the shared charts registry
# consumed by the FluxCD boucio-charts HelmRepository. This is the only publish
# path: nothing consumes the per-project HTTP package registry any more.
# CHARTS_DEPLOY_USER / CHARTS_DEPLOY_TOKEN are group-level CI variables backed by
# a bouc-io group deploy token with write_registry scope (CI_JOB_TOKEN can only
# reach the current project's registry).
publish-oci:
  stage: publish
  # Default branch only. The job always runs there, and the guard below turns a
  # missing CHARTS_DEPLOY_TOKEN into a red pipeline rather than a skipped job -
  # a silent skip would leave Flux serving a stale chart with nothing looking
  # broken on the cluster. CHARTS_DEPLOY_TOKEN is a *protected* variable, so it
  # is absent on feature branches; those never reach this job.
  rules:
    - if: '$CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
      when: never
    - when: on_success
  image:
    name: alpine/helm:latest
    entrypoint: ["/bin/sh", "-c"]
  before_script:
    # Extract the 'version' value from Chart.yaml
    - export HELM_CHART_VER=$(grep '^version:' ./Chart.yaml | awk '{print $2}')
  dependencies:
    - build
  script:
    - test -n "$CHARTS_DEPLOY_TOKEN" || { echo "CHARTS_DEPLOY_TOKEN is not set - chart NOT published"; exit 1; }
    - echo "$CHARTS_DEPLOY_TOKEN" | helm registry login registry.gitlab.com -u "$CHARTS_DEPLOY_USER" --password-stdin
    - helm push ${CHART}-${HELM_CHART_VER}.tgz oci://registry.gitlab.com/bouc-io/charts
