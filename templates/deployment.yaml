apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agent-api-chart.fullname" . }}
  {{- with .Values.deploymentAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "agent-api-chart.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "agent-api-chart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "agent-api-chart.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with include "agent-api-chart.imagePullSecrets" . | fromYamlArray }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "agent-api-chart.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ include "agent-api-chart.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              #containerPort: {{ .Values.service.port }}
              containerPort: {{ .Values.environment.PORT }}
              protocol: TCP
          env:
            - name: NODE_ENV
              value: {{ .Values.environment.NODE_ENV | quote }}
            # Logging Configuration
            - name: LOG_LEVEL
              value: {{ .Values.environment.LOG_LEVEL | quote }}
            - name: PORT
              value: {{ .Values.environment.PORT | quote }}
            # LLM Configuration
            - name: OLLAMA_URL
              value: {{ .Values.environment.OLLAMA_URL | quote }}
            - name: OLLAMA_MODEL
              value: {{ .Values.environment.OLLAMA_MODEL | quote }}
            # OAuth2 Configuration (for token refresh)
            - name: OAUTH_TOKEN_ENDPOINT
              value: {{ .Values.environment.OAUTH_TOKEN_ENDPOINT | quote }}
            - name: OAUTH_CLIENT_ID
              value: {{ .Values.environment.OAUTH_CLIENT_ID | quote }}
            # SSL/TLS Configuration
            - name: ALLOW_SELF_SIGNED_CERTS
              value: {{ .Values.environment.ALLOW_SELF_SIGNED_CERTS | quote }}
            # Tool Execution Configuration
            - name: TOOL_DEFAULT_TIMEOUT_MS
              value: {{ .Values.environment.TOOL_DEFAULT_TIMEOUT_MS | quote }}
            # Memory Service Configuration
            - name: MEMORY_SERVICE_URL
              value: {{ .Values.environment.MEMORY_SERVICE_URL | quote }}
            - name: MEMORY_SERVICE_ENABLED
              value: {{ .Values.environment.MEMORY_SERVICE_ENABLED | quote }}
            # Distillation Service Configuration
            - name: DISTILLATION_SERVICE_URL
              value: {{ .Values.environment.DISTILLATION_SERVICE_URL | quote }}
            - name: DISTILLATION_ENABLED
              value: {{ .Values.environment.DISTILLATION_ENABLED | quote }}
            # Instruction services (GAP 4)
            - name: ADMIN_API_URL
              value: {{ .Values.environment.ADMIN_API_URL | quote }}
            - name: PORTAL_API_URL
              value: {{ .Values.environment.PORTAL_API_URL | quote }}
            - name: CORS_ORIGIN
              value: {{ .Values.environment.CORS_ORIGIN | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "agent-api-chart.dbSecretName" . }}
                  key: DATABASE_URL
            {{- if .Values.redis.enabled }}
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "agent-api-chart.redisSecretName" . }}
                  key: REDIS_URL
            {{- end }}
            # OpenTelemetry: OTLP traces + metrics to the node-local collector, addressed by its
            # Service. The operator sets internalTrafficPolicy: Local on that Service, so each pod
            # still reaches the collector daemonset on its own node. A raw node IP is not a
            # registered mesh destination: under REGISTRY_ONLY the sidecar answers it with 502.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.environment.OTEL_EXPORTER_OTLP_ENDPOINT | default "http://boucio-otel-collector-collector.opentelemetry.svc.cluster.local:4318" | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.environment.OTEL_SERVICE_NAME | quote }}
            # Stamped on direct-scraped /metrics so they line up with the collector-routed
            # otel_* series. Sourced from the cluster-vars ConfigMap via the HelmRelease.
            - name: ENVIRONMENT_ID
              value: {{ .Values.environment.ENVIRONMENT_ID | quote }}
            # Agent execution harness tuning
            - name: MAX_EXECUTION_STEPS
              value: {{ .Values.environment.MAX_EXECUTION_STEPS | quote }}
            - name: EXECUTOR_TIMEOUT_MS
              value: {{ .Values.environment.EXECUTOR_TIMEOUT_MS | quote }}
            - name: LLM_BREAKER_THRESHOLD
              value: {{ .Values.environment.LLM_BREAKER_THRESHOLD | quote }}
            - name: LLM_BREAKER_COOLDOWN_MS
              value: {{ .Values.environment.LLM_BREAKER_COOLDOWN_MS | quote }}
            - name: OLLAMA_KEEP_ALIVE
              value: {{ .Values.environment.OLLAMA_KEEP_ALIVE | quote }}
            - name: SSE_HEARTBEAT_MS
              value: {{ .Values.environment.SSE_HEARTBEAT_MS | quote }}
            # Chat surface (/v1/chats), formerly chatbot-api-server
            - name: MAX_HISTORY_MESSAGES
              value: {{ .Values.environment.MAX_HISTORY_MESSAGES | quote }}
            - name: MEMORY_SEARCH_LIMIT
              value: {{ .Values.environment.MEMORY_SEARCH_LIMIT | quote }}
            - name: OLLAMA_THINK
              value: {{ .Values.environment.OLLAMA_THINK | quote }}
            - name: DISTILLATION_MIN_MESSAGES
              value: {{ .Values.environment.DISTILLATION_MIN_MESSAGES | quote }}
            - name: DISTILLATION_MIN_INTERVAL_MS
              value: {{ .Values.environment.DISTILLATION_MIN_INTERVAL_MS | quote }}
            - name: DISTILLATION_MAX_MESSAGES
              value: {{ .Values.environment.DISTILLATION_MAX_MESSAGES | quote }}
            # Eval harness HITL auto-approval master switch (keep "false" outside eval clusters)
            - name: EVAL_AUTO_APPROVE
              value: {{ .Values.environment.EVAL_AUTO_APPROVE | quote }}
            # Sandboxed code execution (code_execute)
            - name: ALLOW_CODE_EXECUTE
              value: {{ .Values.environment.ALLOW_CODE_EXECUTE | quote }}
            - name: SANDBOX_IMAGE
              value: {{ .Values.environment.SANDBOX_IMAGE | quote }}
            - name: SANDBOX_TIMEOUT_MS
              value: {{ .Values.environment.SANDBOX_TIMEOUT_MS | quote }}
            - name: SANDBOX_MEMORY
              value: {{ .Values.environment.SANDBOX_MEMORY | quote }}
            - name: SANDBOX_CPUS
              value: {{ .Values.environment.SANDBOX_CPUS | quote }}
            - name: SANDBOX_PIDS
              value: {{ .Values.environment.SANDBOX_PIDS | quote }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
